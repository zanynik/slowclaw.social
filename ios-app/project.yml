# XcodeGen spec for the SlowClaw iOS app.
#
#   brew install xcodegen
#   cd ios-app && xcodegen generate && open SlowClaw.xcodeproj
#
# The .xcodeproj is generated (gitignored). No third-party packages, no native
# libraries: SwiftUI + Apple frameworks (Speech, AVFoundation, FoundationModels).

name: SlowClaw
options:
  bundleIdPrefix: com.slowclaw
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${APPLE_DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: "Manual"

targets:
  SlowClaw:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SlowClawApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slowclaw.app
        PRODUCT_NAME: SlowClaw
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        # Scope the app-store profile to the application target.
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROFILE_NAME)"
        INFOPLIST_FILE: SlowClawApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  SlowClaw:
    build:
      targets:
        SlowClaw: all
    run:
      config: Debug
    archive:
      config: Release
