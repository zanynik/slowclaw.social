# XcodeGen project spec for the SlowClaw Social iOS app.
#
# Generate the .xcodeproj with:
#   brew install xcodegen
#   cd ios-app && xcodegen generate
#
# The .xcodeproj is gitignored — regenerate it whenever this file changes.
# This is the modern idiom for projects that want clean, reviewable, diff-able
# project definitions without checking in the verbose pbxproj format.
#
# Build flow (what the Xcode build phases do):
#   1. Run Script phase (pre-build): `zig build -Dtarget=aarch64-ios-sim` (or
#      `-Dtarget=aarch64-ios` for device) → emits zig-out/lib/libslowclaw_feed.a
#      AND zig-out/lib/libsqlite3.a (two separate static archives: the Zig code
#      and the vendored SQLite amalgamation).
#   2. Compile Swift sources (SlowClawApp.swift)
#   3. Link against libslowclaw_feed.a + libsqlite3.a (both from zig-out/lib)
#   4. Copy slowclaw_feed.h as a bridging header

name: SlowClaw
options:
  bundleIdPrefix: com.slowclaw
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${APPLE_DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: "Manual"
    # Link the Zig staticlib + the vendored SQLite + llama.cpp staticlibs.
    # build.zig emits THREE separate archives (libslowclaw_feed.a, libsqlite3.a,
    # libllama.a), so the app must link all three — the Zig lib references the
    # sqlite3_* symbols, and local_inference.zig references the llama_* symbols.
    # -lc++: llama.cpp is compiled for iOS by Apple's toolchain (xcrun clang++),
    # so its objects reference Apple's libc++ — linked here. zig's bundled
    # libc++ 21.1 is ABI-incompatible with the iOS device runtime
    # (emits internals like __hash_memory that dyld can't resolve at launch).
    OTHER_LDFLAGS: "-lslowclaw_feed -lsqlite3 -lllama -lc++"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../zig-src/zig-out/lib"
    # Header search path for the C ABI contract.
    HEADER_SEARCH_PATHS: "$(SRCROOT)/SlowClawFeed/Sources/SlowClawFeed/include"
    SWIFT_OBJC_BRIDGING_HEADER: "SlowClawFeed/Sources/SlowClawFeed/include/slowclaw_feed.h"

targets:
  SlowClaw:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SlowClawApp
      - path: SlowClawFeed/Sources/SlowClawFeed
        excludes:
          - "include/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slowclaw.app
        PRODUCT_NAME: SlowClaw
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SlowClawApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Link the Zig + vendored staticlibs (target-level override of the
        # base OTHER_LDFLAGS). All three come from zig-out/lib.
        OTHER_LDFLAGS: "-lslowclaw_feed -lsqlite3 -lllama -lc++"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../zig-src/zig-out/lib"
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    preBuildScripts:
      - name: Build Zig staticlib
        # The Zig toolchain is downloaded by CI into tools/zig/. Locally,
        # ensure `zig` is on PATH or set ZIG_BIN.
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        # Use the simulator target for sim builds, device target for device.
        # xcodebuild injects $PLATFORM_NAME = 'iphonesimulator' or 'iphoneos'.
        script: |
          set -euo pipefail
          cd "$SRCROOT/../zig-src"
          ZIG="${ZIG_BIN:-../tools/zig/zig}"
          if [ ! -x "$ZIG" ]; then
            ZIG="$(command -v zig || true)"
          fi
          if [ -z "$ZIG" ]; then
            echo "::error::zig not found. Install from https://ziglang.org/download/ or set ZIG_BIN."
            exit 1
          fi
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            SIM_SYSROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
            "$ZIG" build -Dtarget=aarch64-ios-sim -Doptimize=ReleaseFast \
              -Dios-sysroot="${SIM_SYSROOT}" --prefix zig-out-sim
            # The app links BOTH libslowclaw_feed.a and libsqlite3.a out of
            # zig-out/lib, so copy both from the sim prefix.
            mkdir -p zig-out/lib
            cp zig-out-sim/lib/libslowclaw_feed.a zig-out/lib/libslowclaw_feed.a
            cp zig-out-sim/lib/libsqlite3.a zig-out/lib/libsqlite3.a
            cp zig-out-sim/lib/libllama.a zig-out/lib/libllama.a
          else
            IOS_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
            # ReleaseFast (not ReleaseSafe): Zig 0.16's std.debug unconditionally
            # calls _dyld_get_image_header_containing_address, which is
            # __API_UNAVAILABLE(ios) in Apple's SDK → undefined on iOS device
            # (Codeberg ziglang/zig#32138, fixed in 0.17-dev). ReleaseFast drops
            # the safety-panic stack-walk path that references it; the lib has no
            # reachable @panic/unreachable, so this fully removes the reference.
            "$ZIG" build -Dtarget=aarch64-ios -Doptimize=ReleaseFast \
              -Dios-sysroot="${IOS_SYSROOT}"
          fi
          echo "Built: $(ls -lh zig-out/lib/libslowclaw_feed.a zig-out/lib/libsqlite3.a || true)"
        outputFiles:
          - $(SRCROOT)/../zig-src/zig-out/lib/libslowclaw_feed.a
          - $(SRCROOT)/../zig-src/zig-out/lib/libsqlite3.a
          - $(SRCROOT)/../zig-src/zig-out/lib/libllama.a

schemes:
  SlowClaw:
    build:
      targets:
        SlowClaw: all
    run:
      config: Debug
    archive:
      config: Release
