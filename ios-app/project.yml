# XcodeGen spec for the SlowClaw iOS app.
#
#   brew install xcodegen
#   cd ios-app && xcodegen generate && open SlowClaw.xcodeproj
#
# The .xcodeproj is generated (gitignored). One package: libsecp256k1 (Bitcoin Core's
# audited secp256k1 library) for Nostr signatures. Everything else is Apple frameworks.
# The website in ../web is bundled so the phone can serve it over Wi-Fi (local view).

name: SlowClaw
options:
  bundleIdPrefix: com.slowclaw
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  NostrCrypto:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.23.2

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${APPLE_DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: "Manual"

targets:
  SlowClaw:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SlowClawApp
      - path: ../web
        type: folder
        buildPhase: resources
    dependencies:
      - package: NostrCrypto
        product: libsecp256k1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slowclaw.app
        PRODUCT_NAME: SlowClaw
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        # Scope the app-store profile to the application target.
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROFILE_NAME)"
        INFOPLIST_FILE: SlowClawApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  SlowClawTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - target: SlowClaw
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SlowClaw.app/SlowClaw"

schemes:
  SlowClaw:
    build:
      targets:
        SlowClaw: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SlowClawTests
    archive:
      config: Release
