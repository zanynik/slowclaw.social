# XcodeGen project spec for the SlowClaw Social iOS app.
#
# Generate the .xcodeproj with:
#   brew install xcodegen
#   cd ios-app && xcodegen generate
#
# The .xcodeproj is gitignored — regenerate it whenever this file changes.
# This is the modern idiom for projects that want clean, reviewable, diff-able
# project definitions without checking in the verbose pbxproj format.
#
# Build flow (what the Xcode build phases do):
#   1. Run Script phase (pre-build): `zig build -Dtarget=aarch64-ios-sim` (or
#      `-Dtarget=aarch64-ios` for device) → emits zig-out/lib/libslowclaw_feed.a
#   2. Compile Swift sources (SlowClawApp.swift)
#   3. Link against libslowclaw_feed.a + system libsqlite3
#   4. Copy slowclaw_feed.h as a bridging header

name: SlowClaw
options:
  bundleIdPrefix: com.slowclaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "${APPLE_DEVELOPMENT_TEAM}"
    CODE_SIGN_STYLE: "Manual"
    # The Zig staticlib path — built by the pre-build script phase.
    OTHER_LDFLAGS: "-lslowclaw_feed"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../zig-src/zig-out/lib"
    # Header search path for the C ABI contract.
    HEADER_SEARCH_PATHS: "$(SRCROOT)/SlowClawFeed/Sources/SlowClawFeed/include"
    SWIFT_OBJC_BRIDGING_HEADER: "SlowClawFeed/Sources/SlowClawFeed/include/slowclaw_feed.h"

targets:
  SlowClaw:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SlowClawApp
      - path: SlowClawFeed/Sources/SlowClawFeed
        excludes:
          - "include/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slowclaw.app
        PRODUCT_NAME: SlowClaw
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SlowClawApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Link the Zig staticlib (built by the pre-build script). SQLite is
        # statically compiled INTO libslowclaw_feed.a via the vendored
        # amalgamation, so no separate -lsqlite3 flag.
        OTHER_LDFLAGS: "-lslowclaw_feed"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../zig-src/zig-out/lib"
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    preBuildScripts:
      - name: Build Zig staticlib
        # The Zig toolchain is downloaded by CI into tools/zig/. Locally,
        # ensure `zig` is on PATH or set ZIG_BIN.
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        # Use the simulator target for sim builds, device target for device.
        # xcodebuild injects $PLATFORM_NAME = 'iphonesimulator' or 'iphoneos'.
        script: |
          set -euo pipefail
          cd "$SRCROOT/../zig-src"
          ZIG="${ZIG_BIN:-../tools/zig/zig}"
          if [ ! -x "$ZIG" ]; then
            ZIG="$(command -v zig || true)"
          fi
          if [ -z "$ZIG" ]; then
            echo "::error::zig not found. Install from https://ziglang.org/download/ or set ZIG_BIN."
            exit 1
          fi
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            "$ZIG" build -Dtarget=aarch64-ios-sim -Doptimize=ReleaseSafe --prefix zig-out-sim
            cp zig-out-sim/lib/libslowclaw_feed.a zig-out/lib/libslowclaw_feed.a
          else
            "$ZIG" build -Dtarget=aarch64-ios -Doptimize=ReleaseSafe
          fi
          echo "Built: $(ls -lh zig-out/lib/libslowclaw_feed.a || true)"
        outputFiles:
          - $(SRCROOT)/../zig-src/zig-out/lib/libslowclaw_feed.a

schemes:
  SlowClaw:
    build:
      targets:
        SlowClaw: all
    run:
      config: Debug
    archive:
      config: Release
