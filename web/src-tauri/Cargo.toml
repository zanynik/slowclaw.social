[package]
name = "slowclaw_mobile"
version = "0.1.0"
description = "SlowClaw mobile companion app"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.77"

[workspace]

[lib]
name = "slowclaw_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
zeroclaw = { package = "slowclaw", path = "../.." }
llama-cpp-2 = { version = "0.1.146", optional = true, features = ["metal"] }

[features]
default = []
native-inference = ["dep:llama-cpp-2"]
