[package]
name = "slowclaw_mobile"
version = "0.1.0"
description = "SlowClaw mobile companion app"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.77"

[workspace]

[lib]
name = "slowclaw_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
zeroclaw = { package = "slowclaw", path = "../.." }
llama-cpp-2 = { version = "0.1.146", optional = true, features = ["metal"] }
# Direct dep so the background ingester can drive a long-lived Nostr client
# and subscriptions. Matches the core crate's version + feature set exactly
# (no feature drift) — the core already pulls these in transitively.
nostr-sdk = { version = "0.44", default-features = false, features = ["nip04", "nip59"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
anyhow = "1"

# Mobile targets (iOS, Android) opt the core crate OUT of `desktop-synthesis`
# so the embedded gateway that ships in the mobile app does not register the
# workspace/article synthesizer routes, the feed content-agent routes, or the
# background synthesizer auto-spawns. Mobile AI features run on-device via the
# native bridges (`nativeAiChat`, `transcribeAudio`) instead. Desktop (macOS,
# Windows, Linux) keeps the default-on `desktop-synthesis` feature.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
zeroclaw = { package = "slowclaw", path = "../..", default-features = false }

[features]
default = []
native-inference = ["dep:llama-cpp-2"]
