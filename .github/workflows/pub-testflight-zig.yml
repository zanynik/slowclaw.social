name: Publish iOS TestFlight (Zig)

# Zig-only TestFlight build. Replaces the Tauri/Rust pipeline on the
# zig-ios-pivot branch — no Cargo, no npm, no web bundling.
#
# Triggered on push to zig-ios-pivot OR manually via workflow_dispatch. The
# App Store Connect + signing secrets are reused from the existing
# pub-testflight-ios.yml setup — they're repo-wide secrets, not per-workflow.

on:
    push:
        branches:
            - zig-ios-pivot
        paths:
            - ".github/workflows/pub-testflight-zig.yml"
            - "zig-src/**"
            - "ios-app/**"
    workflow_dispatch:
        inputs:
            build_number:
                description: "Optional App Store build number. Defaults to the GitHub run number."
                required: false
                type: string
            apple_development_team:
                description: "Optional Apple Developer Team ID. Defaults to the APPLE_DEVELOPMENT_TEAM repository variable or secret."
                required: false
                type: string

concurrency:
    group: testflight-zig-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build-and-upload:
        name: Build and Upload iOS App (Zig)
        runs-on: macos-26
        timeout-minutes: 45
        env:
            ZIG_BIN: ${{ github.workspace }}/tools-zig/zig
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Setup Zig
              run: |
                  set -euo pipefail
                  # Pin a specific Zig version for reproducible CI builds.
                  # Update in lockstep with zig-src/README.md when bumping.
                  # The macOS runner is arm64 (macos-26-arm64), so aarch64-macos.
                  ZIG_VERSION="0.16.0"
                  ZIG_ARCH="aarch64-macos"
                  curl -L --fail -o /tmp/zig.tar.xz \
                    "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz"
                  mkdir -p tools-zig
                  tar -xf /tmp/zig.tar.xz -C tools-zig --strip-components=1
                  rm /tmp/zig.tar.xz
                  "${ZIG_BIN}" version

            - name: Install XcodeGen
              run: |
                  set -euo pipefail
                  if ! command -v xcodegen >/dev/null 2>&1; then
                    brew install xcodegen
                  fi
                  xcodegen --version

            - name: Build Zig staticlib (iOS device)
              working-directory: zig-src
              run: |
                  set -euo pipefail
                  # Resolve the iOS SDK path so Zig can find libc headers
                  # (stdio.h etc.) when compiling sqlite3.c. build.zig also
                  # tries xcrun auto-discovery, but passing it explicitly is
                  # more robust in CI.
                  IOS_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
                  echo "iOS sysroot: ${IOS_SYSROOT}"
                  # ReleaseFast (not ReleaseSafe): Zig 0.16's std.debug calls
                  # _dyld_get_image_header_containing_address, which is
                  # __API_UNAVAILABLE(ios) in Apple's SDK → undefined on iOS
                  # device (Codeberg ziglang/zig#32138, fixed in 0.17-dev).
                  # ReleaseFast drops the safety-panic stack-walk path that
                  # references it; the lib has no reachable @panic/unreachable.
                  "${ZIG_BIN}" build -Dtarget=aarch64-ios -Doptimize=ReleaseFast \
                    -Dios-sysroot="${IOS_SYSROOT}"
                  ls -lh zig-out/lib/
                  # Sanity-check the staticlib archive is Apple-`ld`-acceptable:
                  # Zig 0.16 emits misaligned Mach-O members (Codeberg
                  # ziglang/zig#35280), which build.zig repacks via
                  # libtool/ranlib on macOS. `nm` reading the symbol table
                  # exercises the same archive walk `ld` does, so a regression
                  # surfaces here instead of 5 min later at the link step.
                  echo "Verifying libslowclaw_feed.a archive layout..."
                  nm -a zig-out/lib/libslowclaw_feed.a >/dev/null
                  echo "Archive OK."

            - name: Generate Xcode project
              working-directory: ios-app
              run: |
                  set -euo pipefail
                  xcodegen generate

            - name: Prepare App Store Connect API key
              env:
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  : "${APP_STORE_CONNECT_ISSUER_ID:?APP_STORE_CONNECT_ISSUER_ID secret is required}"
                  : "${APP_STORE_CONNECT_KEY_ID:?APP_STORE_CONNECT_KEY_ID secret is required}"
                  : "${APP_STORE_CONNECT_PRIVATE_KEY:?APP_STORE_CONNECT_PRIVATE_KEY secret is required}"

                  printf '::add-mask::%s\n' "${APP_STORE_CONNECT_ISSUER_ID}"
                  printf '::add-mask::%s\n' "${APP_STORE_CONNECT_KEY_ID}"

                  ASC_KEY_DIR="${HOME}/.appstoreconnect/private_keys"
                  printf 'ASC_KEY_DIR=%s\n' "${ASC_KEY_DIR}" >>"${GITHUB_ENV}"
                  mkdir -p "${ASC_KEY_DIR}"
                  chmod 700 "${ASC_KEY_DIR}"
                  perl -pe 's/\\n/\n/g' <<<"${APP_STORE_CONNECT_PRIVATE_KEY}" >"${ASC_KEY_DIR}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
                  chmod 600 "${ASC_KEY_DIR}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

            - name: Prepare Apple distribution signing assets
              env:
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APPLE_DEVELOPMENT_TEAM: ${{ inputs.apple_development_team || vars.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_DEVELOPMENT_TEAM }}
                  APP_BUNDLE_ID: com.slowclaw.app
              run: |
                  set -euo pipefail
                  : "${ASC_KEY_DIR:?ASC_KEY_DIR was not initialized}"
                  : "${APP_STORE_CONNECT_ISSUER_ID:?APP_STORE_CONNECT_ISSUER_ID secret is required}"
                  : "${APP_STORE_CONNECT_KEY_ID:?APP_STORE_CONNECT_KEY_ID secret is required}"
                  : "${APPLE_DEVELOPMENT_TEAM:?Set the APPLE_DEVELOPMENT_TEAM repository variable or provide the apple_development_team workflow input.}"

                  SIGNING_DIR="${RUNNER_TEMP}/apple-signing"
                  mkdir -p "${SIGNING_DIR}" "${HOME}/Library/MobileDevice/Provisioning Profiles"
                  chmod 700 "${SIGNING_DIR}"

                  KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
                  P12_PASSWORD="$(openssl rand -hex 32)"
                  KEYCHAIN_PATH="${RUNNER_TEMP}/slowclaw-signing.keychain-db"
                  printf '::add-mask::%s\n' "${KEYCHAIN_PASSWORD}"
                  printf '::add-mask::%s\n' "${P12_PASSWORD}"
                  printf 'KEYCHAIN_PASSWORD=%s\n' "${KEYCHAIN_PASSWORD}" >>"${GITHUB_ENV}"
                  printf 'APPLE_SIGNING_KEYCHAIN=%s\n' "${KEYCHAIN_PATH}" >>"${GITHUB_ENV}"

                  openssl genrsa -out "${SIGNING_DIR}/signing.key" 2048
                  openssl req -new -key "${SIGNING_DIR}/signing.key" -out "${SIGNING_DIR}/signing.csr" -subj "/CN=SlowClaw CI/"

                  # Reuse the existing workflow's Node script for App Store Connect
                  # cert + profile issuance. The script is identical to the one in
                  # pub-testflight-ios.yml; kept in lockstep on purpose.
                  ASC_KEY_PATH="${ASC_KEY_DIR}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
                  PROFILE_NAME="SlowClaw CI App Store ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  ASC_KEY_PATH="${ASC_KEY_PATH}" \
                  ASC_ISSUER_ID="${APP_STORE_CONNECT_ISSUER_ID}" \
                  ASC_KEY_ID="${APP_STORE_CONNECT_KEY_ID}" \
                  APP_BUNDLE_ID="${APP_BUNDLE_ID}" \
                  CERT_CSR_PATH="${SIGNING_DIR}/signing.csr" \
                  CERT_OUT_PATH="${SIGNING_DIR}/distribution.cer" \
                  PROFILE_OUT_PATH="${SIGNING_DIR}/profile.mobileprovision" \
                  PROFILE_ID_OUT_PATH="${SIGNING_DIR}/profile.id" \
                  PROFILE_NAME_OUT_PATH="${SIGNING_DIR}/profile.name" \
                  PROFILE_NAME="${PROFILE_NAME}" \
                  node .github/workflows/scripts/asc-issue-cert-profile.js

                  # Import the cert + private key into a dedicated keychain.
                  security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
                  security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
                  security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
                  openssl pkcs12 -export -out "${SIGNING_DIR}/distribution.p12" \
                    -inkey "${SIGNING_DIR}/signing.key" \
                    -in "${SIGNING_DIR}/distribution.cer" \
                    -passout "pass:${P12_PASSWORD}"
                  security import "${SIGNING_DIR}/distribution.p12" -P "${P12_PASSWORD}" \
                    -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
                  security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain
                  security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

                  # Install the provisioning profile. The UUID is issued by App
                  # Store Connect — read it back from the file the JS script wrote.
                  APPLE_PROVISIONING_PROFILE_ID="$(cat "${SIGNING_DIR}/profile.id")"
                  APPLE_PROVISIONING_PROFILE_NAME="$(cat "${SIGNING_DIR}/profile.name")"
                  cp "${SIGNING_DIR}/profile.mobileprovision" \
                     "${HOME}/Library/MobileDevice/Provisioning Profiles/${APPLE_PROVISIONING_PROFILE_ID}.mobileprovision"
                  printf 'APP_PROFILE_UUID=%s\n' "${APPLE_PROVISIONING_PROFILE_ID}" >>"${GITHUB_ENV}"
                  printf 'APP_PROFILE_NAME=%s\n' "${APPLE_PROVISIONING_PROFILE_NAME}" >>"${GITHUB_ENV}"

            - name: Resolve build number
              id: build_number
              run: |
                  if [ -n "${{ inputs.build_number }}" ]; then
                    echo "number=${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Archive
              working-directory: ios-app
              env:
                  APPLE_DEVELOPMENT_TEAM: ${{ inputs.apple_development_team || vars.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_DEVELOPMENT_TEAM }}
              run: |
                  set -euo pipefail
                  xcodebuild archive \
                    -project SlowClaw.xcodeproj \
                    -scheme SlowClaw \
                    -configuration Release \
                    -destination "generic/platform=iOS" \
                    -archivePath "${RUNNER_TEMP}/SlowClaw.xcarchive" \
                    DEVELOPMENT_TEAM="${APPLE_DEVELOPMENT_TEAM}" \
                    CODE_SIGN_IDENTITY="Apple Distribution" \
                    CODE_SIGNING_REQUIRED=YES \
                    CODE_SIGNING_ALLOWED=YES \
                    PROVISIONING_PROFILE_SPECIFIER="" \
                    PROVISIONING_PROFILE="${APP_PROFILE_UUID}" \
                    CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.number }}"

            - name: Export IPA
              working-directory: ios-app
              run: |
                  set -euo pipefail
                  EXPORT_DIR="${RUNNER_TEMP}/SlowClaw-export"
                  mkdir -p "${EXPORT_DIR}"
                  cat >"${EXPORT_DIR}/ExportOptions.plist" <<PLIST
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                      <key>method</key>
                      <string>app-store</string>
                      <key>teamID</key>
                      <string>${APPLE_DEVELOPMENT_TEAM}</string>
                      <key>provisioningProfiles</key>
                      <dict>
                          <key>com.slowclaw.app</key>
                          <dict>
                              <key>identifier</key>
                              <string>${APP_PROFILE_UUID}</string>
                              <key>name</key>
                              <string>${APP_PROFILE_NAME}</string>
                          </dict>
                      </dict>
                      <key>signingStyle</key>
                      <string>manual</string>
                      <key>stripSwiftSymbols</key>
                      <true/>
                      <key>uploadBitcode</key>
                      <false/>
                      <key>uploadSymbols</key>
                      <true/>
                  </dict>
                  </plist>
                  PLIST
                  xcodebuild -exportArchive \
                    -archivePath "${RUNNER_TEMP}/SlowClaw.xcarchive" \
                    -exportOptionsPlist "${EXPORT_DIR}/ExportOptions.plist" \
                    -exportPath "${EXPORT_DIR}" \
                    -allowProvisioningUpdates

            - name: Upload to TestFlight
              env:
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
              run: |
                  set -euo pipefail
                  IPA="$(find "${RUNNER_TEMP}/SlowClaw-export" -name '*.ipa' | head -1)"
                  if [ -z "${IPA}" ]; then
                    echo "::error::No IPA produced by the export step"
                    exit 1
                  fi
                  echo "Uploading ${IPA} to TestFlight via altool..."
                  xcrun altool --upload-app \
                    -f "${IPA}" \
                    -t ios \
                    --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
                    --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}" \
                    --verbose

            - name: Cleanup signing keychain
              if: always()
              run: |
                  set -e
                  if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ] && [ -f "${APPLE_SIGNING_KEYCHAIN}" ]; then
                    security delete-keychain "${APPLE_SIGNING_KEYCHAIN}" || true
                  fi
                  rm -rf "${HOME}/.appstoreconnect" || true
