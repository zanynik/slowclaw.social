name: Intern-Decision GGUF compatibility smoke

on:
  push:
    branches:
      - bench/slowclaw-decision-models
    paths:
      - ".github/workflows/intern-decision-gguf-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZIG_BIN: ${{ github.workspace }}/tools-zig/zig
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Zig
        run: |
          set -euo pipefail
          ZIG_VERSION="0.16.0"
          curl -L --fail -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p tools-zig
          tar -xf /tmp/zig.tar.xz -C tools-zig --strip-components=1
          "$ZIG_BIN" version

      - name: Download Intern-Decision Q8
        run: |
          python -m pip install --upgrade huggingface_hub
          MODEL_PATH="$(python -c 'from huggingface_hub import hf_hub_download; print(hf_hub_download(repo_id="bombdefuser-124/Intern-Decision-0.8B-GGUF", filename="intern-decision-0.8b-q8_0.gguf", revision="main"))')"
          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
          ls -lh "$MODEL_PATH"

      - name: Load Intern-Decision with SlowClaw local inference
        working-directory: zig-src
        run: |
          set -euo pipefail
          /usr/bin/time -v env SLOWCLAW_TEST_GGUF="$MODEL_PATH" \
            "$ZIG_BIN" build test-local-llm -Doptimize=ReleaseFast 2>&1 | tee /tmp/intern-gguf-smoke.log
          grep -E "qwen35|model|load|MiB|MB|tokens|Maximum resident" /tmp/intern-gguf-smoke.log || true
